<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Territory Game v0.1.7</title>
<style>
:root{--panel:#17313d;--text:#fff;--muted:#c9d8df;--pick:#ffe676}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d171a;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{height:100%;display:flex;flex-direction:column}header{height:50px;display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);z-index:5}.title{font-weight:900;font-size:13px;white-space:nowrap}.ver{font-size:10px;color:var(--muted)}#hud{flex:1;text-align:center;font-size:10px;color:var(--muted)}button{border:0;border-radius:8px;padding:7px 8px;background:#294957;color:#fff;font-weight:800;font-size:11px}#game{position:relative;flex:1;min-height:0;touch-action:none;background:linear-gradient(#87dc59,#6bc146)}svg{width:100%;height:100%;display:block;touch-action:none}.route{stroke:#fff;stroke-width:2.5;stroke-dasharray:8 8;opacity:.22;vector-effect:non-scaling-stroke}.route.auto{stroke:#ffe676;stroke-width:5;opacity:.95}.zone{stroke:#ffffff55;stroke-width:2;vector-effect:non-scaling-stroke}.zone.player{fill:#4d9fff66}.zone.enemy{fill:#ff616166}.zone.green{fill:#51cf8366}.zone.neutral{fill:#d6d6d655}.towerBase{stroke:#24323a;stroke-width:4;vector-effect:non-scaling-stroke}.node.player .towerBase{fill:#2d8cff}.node.enemy .towerBase{fill:#ef4d4d}.node.green .towerBase{fill:#35b96b}.node.neutral .towerBase{fill:#b9b9b9}.towerTop{fill:#f5f6f7;stroke:#263640;stroke-width:3;vector-effect:non-scaling-stroke}.node.selected .towerBase{stroke:var(--pick);stroke-width:8}.node.target .towerBase{stroke:#fff;stroke-width:8}.troops{fill:#152028;font-size:18px;font-weight:950;text-anchor:middle}.rate{fill:#20343d;font-size:10px;font-weight:850;text-anchor:middle}.unit circle{stroke:#fff;stroke-width:2.5;vector-effect:non-scaling-stroke}.unit text{fill:#fff;font-size:10px;font-weight:900;text-anchor:middle;dominant-baseline:middle}.trace{fill:none;stroke:#ffe676;stroke-width:6;stroke-linecap:round;stroke-linejoi </style></head><body><div id="app"><header><div class="title">Territory Game <span class="ver">v0.1.7</span></div><div id="hud"></div><button id="pause">일시정지</button><button id="restart">새 게임</button></header><div id="game"><svg id="map" viewBox="0 0 2200 1320" preserveAspectRatio="xMidYMid meet"></svg><div id="zoom"><button id="zin">＋</button><button id="zout">－</button></div><div id="toast"></div><div id="overlay"><div id="card"><h2 id="resultTitle"></h2><p id="resultText"></p><button id="again">한 판 더</button></div></div></div><footer>40 Territory · 랜덤 시작 · 숨은 생산/이동 타일 · 60% 점령 승리</footer></div>
<script>(()=>{
const NS='http://www.w3.org/2000/svg',svg=document.querySelector('#map'),hud=document.querySelector('#hud'),toast=document.querySelector('#toast'),overlay=document.querySelector('#overlay');
const TEAM={player:'#2d8cff',enemy:'#ef4d4d',green:'#35b96b',neutral:'#aaa'},WORLD={w:2200,h:1320};const MOVE_TILE_PX=55,MOVE_SPEED=3.2,WIN_COUNT=24;
const P=[[146,119],[425,106],[654,168],[927,146],[1259,107],[1519,127],[1729,111],[2050,153],[113,390],[386,430],[699,367],[987,375],[1213,440],[1535,434],[1732,433],[2069,410],[111,648],[380,691],[662,657],[968,638],[1254,635],[1528,659],[1796,643],[2008,694],[178,904],[422,892],[715,888],[987,887],[1264,906],[1518,948],[1779,920],[2054,954],[163,1186],[413,1171],[668,1171],[925,1213],[1223,1207],[1518,1183],[1782,1176],[2072,1149]];
const TILES=[6,10,9,7,17,8,7,9,9,6,16,6,12,20,10,12,12,17,8,11,8,10,9,16,12,9,23,12,6,14,9,19,11,6,17,11,11,8,16,10];
const EDGES=[[0,1],[0,8],[0,9],[1,2],[1,9],[2,3],[2,10],[2,11],[3,4],[3,10],[3,11],[4,5],[4,12],[4,13],[5,6],[5,13],[6,7],[6,13],[6,14],[6,15],[7,15],[8,9],[8,16],[9,10],[9,17],[9,18],[10,11],[10,17],[10,18],[11,12],[11,19],[11,20],[12,13],[12,20],[13,14],[13,20],[13,21],[13,22],[14,15],[14,22],[15,23],[16,17],[16,24],[16,25],[17,18],[17,24],[17,25],[18,19],[18,26],[18,27],[19,20],[19,27],[20,21],[20,27],[20,28],[20,29],[21,22],[21,29],[22,23],[22,30],[22,31],[23,30],[23,31],[24,25],[24,32],[25,26],[25,33],[25,34],[26,27],[26,34],[27,28],[27,34],[27,35],[27,36],[28,29],[28,36],[29,30],[29,37],[29,38],[30,31],[30,37],[30,38],[31,39],[32,33],[33,34],[34,35],[35,36],[36,37],[37,38],[38,39]];
let territories=[],units=[],gesture=null,selectedSource=null,autoPath=null,running=true,paused=false,last=performance.now(),aiClock=0,toastTimer=0,view={x:0,y:0,w:2200,h:1320},pan=null;
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function edgeTiles(a,b){return Math.max(1,Math.ceil(D(territories[a],territories[b])/MOVE_TILE_PX))}function routeTiles(p){let n=0;for(let i=0;i<p.length-1;i++)n+=edgeTiles(p[i],p[i+1]);return n}function neighbors(id){const o=[];for(const[a,b]of EDGES){if(a===id)o.push(b);else if(b===id)o.push(a)}return o}function adjacent(a,b){return EDGES.some(e=>(e[0]===a&&e[1]===b)||(e[1]===a&&e[0]===b))}
function shortestOwnedPath(start,target,owner='player'){const n=territories.length,dist=Array(n).fill(Infinity),prev=Array(n).fill(-1),used=Array(n).fill(false);dist[start]=0;for(let k=0;k<n;k++){let u=-1,b=Infinity;for(let i=0;i<n;i++)if(!used[i]&&dist[i]<b){b=dist[i];u=i}if(u<0)break;used[u]=true;if(u===target)break;for(const v of neighbors(u)){if(v!==target&&territories[v].owner!==owner)continue;if(u!==start&&u!==target&&territories[u].owner!==owner)continue;const nd=dist[u]+edgeTiles(u,v);if(nd<dist[v]){dist[v]=nd;prev[v]=u}}}if(!Number.isFinite(dist[target]))return null;const path=[];let c=target;while(c!==-1){path.push(c);if(c===start)break;c=prev[c]}return path.at(-1)===start?path.reverse():null}
function rand(a){return a[Math.floor(Math.random()*a.length)]}function chooseStarts(){const pairs=EDGES.slice().sort(()=>Math.random()-.5),chosen=[];for(const e of pairs){const mid={x:(P[e[0]][0]+P[e[1]][0])/2,y:(P[e[0]][1]+P[e[1]][1])/2};if(chosen.every(c=>Math.hypot(mid.x-c.mid.x,mid.y-c.mid.y)>700)){chosen.push({ids:e,mid});if(chosen.length===3)break}}if(chosen.length<3)return [[0,1],[30,31],[34,35]];return chosen.map(x=>x.ids)}
function setStart(ids,owner){ids.forEach((id,i)=>{const t=territories[id];t.owner=owner;t.troops=i?20:30;if(i===0){t.tileCount=owner==='player'?26:22;t.rate=t.tileCount*.1;t.r=30+t.tileCount*2.15}})}function resetData(){territories=P.map((p,id)=>({id,x:p[0],y:p[1],owner:'neutral',troops:5+(id*7)%10,tileCount:TILES[id],rate:TILES[id]*.1,freeze:0,r:30+TILES[id]*2.15}));const s=chooseStarts();setStart(s[0],'player');setStart(s[1],'enemy');setStart(s[2],'green')}
function applyView(){view.x=Math.max(0,Math.min(WORLD.w-view.w,view.x));view.y=Math.max(0,Math.min(WORLD.h-view.h,view.y));svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)}function zoom(f,cx=view.x+view.w/2,cy=view.y+view.h/2){const nw=Math.max(700,Math.min(WORLD.w,view.w*f)),nh=nw*(WORLD.h/WORLD.w);view.x=cx-nw/2;view.y=cy-nh/2;view.w=nw;view.h=nh;applyView()}
function renderBase(){svg.innerHTML='';const bg=document.createElementNS(NS,'g');svg.append(bg);for(let i=0;i<45;i++){const c=document.createElementNS(NS,'circle');c.setAttribute('cx',60+(i*347)%2080);c.setAttribute('cy',60+(i*223)%1200);c.setAttribute('r',10+(i%5)*5);c.setAttribute('fill','#4ca63c22');bg.append(c)}const rg=document.createElementNS(NS,'g');rg.id='routes';svg.append(rg);for(const[a,b]of EDGES){const l=document.createElementNS(NS,'line');l.setAttribute('x1',territories[a].x);l.setAttribute('y1',territories[a].y);l.setAttribute('x2',territories[b].x);l.setAttribute('y2',territories[b].y);l.setAttribute('class','route');l.dataset.a=a;l.dataset.b=b;rg.append(l)}const zg=document.createElementNS(NS,'g');zg.id='zones';svg.append(zg);for(const t of territories){const z=document.createElementNS(NS,'circle');z.dataset.id=t.id;z.setAttribute('cx',t.x);z.setAttribute('cy',t.y);z.setAttribute('r',t.r);zg.append(z)}const tr=document.createElementNS(NS,'polyline');tr.id='trace';tr.setAttribute('class','trace');tr.style.display='none';svg.append(tr);const ng=document.createElementNS(NS,'g');ng.id='nodes';svg.append(ng);for(const t of territories){const g=document.createElementNS(NS,'g');g.dataset.id=t.id;const base=document.createElementNS(NS,'circle'),top=document.createElementNS(NS,'rect'),tx=document.createElementNS(NS,'text'),rt=document.createElementNS(NS,'text');base.setAttribute('cx',t.x);base.setAttribute('cy',t.y);base.setAttribute('r',23);base.setAttribute('class','towerBase');top.setAttribute('x',t.x-11);top.setAttribute('y',t.y-20);top.setAttribute('width',22);top.setAttribute('height',16);top.setAttribute('rx',5);top.setAttribute('class','towerTop');tx.setAttribute('x',t.x);tx.setAttribute('y',t.y+43);tx.setAttribute('class','troops');rt.setAttribute('x',t.x);rt.setAttribute('y',t.y+58);rt.setAttribute('class','rate');g.append(base,top,tx,rt);ng.append(g)}const ug=document.createElementNS(NS,'g');ug.id='units';svg.append(ug)}
function update(){for(const t of territories){const z=svg.querySelector(`#zones [data-id="${t.id}"]`),g=svg.querySelector(`#nodes [data-id="${t.id}"]`);z.setAttribute('class',`zone ${t.owner}`);let cls=`node ${t.owner}`;if(gesture?.path.includes(t.id)||selectedSource===t.id)cls+=' selected';if(gesture?.target===t.id)cls+=' target';g.setAttribute('class',cls);g.querySelector('.troops').textContent=Math.floor(t.troops);g.querySelector('.rate').textContent=`+${t.rate.toFixed(1)}/s`}for(const l of svg.querySelectorAll('.route'))l.setAttribute('class','route');if(autoPath)for(let i=0;i<autoPath.length-1;i++)for(const l of svg.querySelectorAll('.route')){const x=+l.dataset.a,y=+l.dataset.b;if((x===autoPath[i]&&y===autoPath[i+1])||(y===autoPath[i]&&x===autoPath[i+1]))l.setAttribute('class','route auto')}const c={player:0,enemy:0,green:0};for(const t of territories)if(c[t.owner]!=null)c[t.owner]++;hud.textContent=`🔵${c.player} 🔴${c.enemy} 🟢${c.green} · ${WIN_COUNT}승`}
function svgPoint(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}function at(p){let b=null,d=1e9;for(const t of territories){const q=Math.hypot(p.x-t.x,p.y-t.y);if(q<t.r+18&&q<d){b=t;d=q}}return b}
function down(e){if(!running||paused)return;const p=svgPoint(e),t=at(p);e.preventDefault();if(!t){pan={pid:e.pointerId,x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.setPointerCapture?.(e.pointerId);return}gesture={pid:e.pointerId,path:t.owner==='player'?[t.id]:[],target:null,start:t.id,moved:false,startX:e.clientX,startY:e.clientY};svg.setPointerCapture?.(e.pointerId);if(t.owner==='player')trace(p);update()}
function move(e){if(pan&&pan.pid===e.pointerId){const sx=view.w/svg.clientWidth,sy=view.h/svg.clientHeight;view.x=pan.vx-(e.clientX-pan.x)*sx;view.y=pan.vy-(e.clientY-pan.y)*sy;applyView();return}if(!gesture||gesture.pid!==e.pointerId)return;e.preventDefault();if(Math.hypot(e.clientX-gesture.startX,e.clientY-gesture.startY)>12)gesture.moved=true;if(!gesture.path.length)return;const p=svgPoint(e),t=at(p);if(t){const last=gesture.path.at(-1);if(t.owner==='player'){if(t.id!==last&&!gesture.path.includes(t.id)&&adjacent(last,t.id))gesture.path.push(t.id);gesture.target=null}else gesture.target=adjacent(last,t.id)?t.id:null}trace(p);update()}
function dispatchChained(path,target,owner='player'){if(path.length<2)return 0;let sent=0;for(let i=0;i<path.length-1;i++){const source=path[i];if(territories[source].owner!==owner)continue;if(send(source,target,owner,path.slice(i)))sent++}return sent}
function up(e){if(pan&&pan.pid===e.pointerId){pan=null;svg.releasePointerCapture?.(e.pointerId);return}if(!gesture||gesture.pid!==e.pointerId)return;e.preventDefault();const g=gesture,t=at(svgPoint(e));gesture=null;svg.releasePointerCapture?.(e.pointerId);svg.querySelector('#trace').style.display='none';if(!g.moved){handleTap(t);update();return}if(!g.path.length){update();return}let target=null,full=null;if(t&&t.owner==='player'&&g.path.length>=2&&t.id===g.path.at(-1)){target=t.id;full=g.path.slice()}else if(t&&t.owner!=='player'&&adjacent(g.path.at(-1),t.id)){target=t.id;full=g.path.concat(t.id)}else if(g.target!=null){target=g.target;full=g.path.concat(target)}if(target==null||!full){msg('연결된 목표에 드롭');update();return}selectedSource=null;autoPath=null;const sent=dispatchChained(full,target);msg(`${sent}개 병력군 · ${routeTiles(full)}칸 출발`);update()}
function handleTap(t){if(!t){selectedSource=null;autoPath=null;return}if(selectedSource==null){if(t.owner==='player'){selectedSource=t.id;msg('목표를 탭')}}else{if(t.id===selectedSource){selectedSource=null;return}const path=shortestOwnedPath(selectedSource,t.id);if(!path){msg('내 땅을 통한 경로 없음');return}autoPath=path.slice();selectedSource=null;setTimeout(()=>{const sent=dispatchChained(path,t.id);msg(`${sent}개 병력군 · 최단 ${routeTiles(path)}칸`);autoPath=null;update()},180)}}function cancel(){gesture=null;pan=null;const t=svg.querySelector('#trace');if(t)t.style.display='none';update()}function trace(p){if(!gesture?.path.length)return;const tr=svg.querySelector('#trace'),pts=gesture.path.map(id=>territories[id]).concat([p]);tr.style.display='block';tr.setAttribute('points',pts.map(q=>`${q.x},${q.y}`).join(' '))}
function send(fromId,target,owner,path){const from=territories[fromId];let amount=Math.floor(from.troops*.5);amount=Math.min(amount,Math.max(0,Math.floor(from.troops)-1));if(amount<1)return false;from.troops-=amount;units.push({owner,amount,target,path,seg:0,prog:0,tileSpeed:MOVE_SPEED});return true}function ai(owner){const mine=territories.filter(t=>t.owner===owner&&t.troops>=9),opts=[];for(const s of mine)for(const n of neighbors(s.id)){const t=territories[n];if(t.owner!==owner)opts.push({s,t,score:t.troops-s.troops*.25+(t.owner==='neutral'?0:-2)+edgeTiles(s.id,t.id)*.25})}if(!opts.length)return;opts.sort((a,b)=>a.score-b.score);const p=opts[Math.floor(Math.random()*Math.min(4,opts.length))];send(p.s.id,p.t.id,owner,[p.s.id,p.t.id])}
function moveUnit(u,dt){let rem=u.tileSpeed*dt;while(rem>0&&u.seg<u.path.length-1){const a=u.path[u.seg],b=u.path[u.seg+1],cost=edgeTiles(a,b),left=(1-u.prog)*cost;if(rem<left){u.prog+=rem/cost;rem=0}else{rem-=left;u.seg++;u.prog=0}}return u.seg>=u.path.length-1}function pos(u){const a=territories[u.path[u.seg]],b=territories[u.path[Math.min(u.seg+1,u.path.length-1)]];return{x:a.x+(b.x-a.x)*u.prog,y:a.y+(b.y-a.y)*u.prog}}function arrive(u){const t=territories[u.target];if(t.owner===u.owner){t.troops=Math.min(99,t.troops+u.amount);return}if(u.amount>t.troops){t.owner=u.owner;t.troops=u.amount-t.troops;t.freeze=2.5}else if(u.amount<t.troops)t.troops-=u.amount;else{t.owner='neutral';t.troops=0;t.freeze=2.5}}
function renderUnits(){const g=svg.querySelector('#units');g.innerHTML='';for(const u of units){const p=pos(u),e=document.createElementNS(NS,'g'),c=document.createElementNS(NS,'circle'),tx=document.createElementNS(NS,'text');e.setAttribute('class','unit');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',15);c.setAttribute('fill',TEAM[u.owner]);tx.setAttribute('x',p.x);tx.setAttribute('y',p.y);tx.textContent=u.amount;e.append(c,tx);g.append(e)}}function checkWin(){const pc=territories.filter(t=>t.owner==='player').length;if(pc>=WIN_COUNT)return end('승리',`40개 중 ${WIN_COUNT}개 Territory 확보`);if(pc===0&&!units.some(u=>u.owner==='player'))return end('패배','파랑 Territory가 모두 사라졌습니다')}function end(a,b){running=false;document.querySelector('#resultTitle').textContent=a;document.querySelector('#resultText').textContent=b;overlay.style.display='flex'}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(running&&!paused){for(const t of territories){if(t.freeze>0)t.freeze=Math.max(0,t.freeze-dt);else if(t.owner!=='neutral')t.troops=Math.min(99,t.troops+t.rate*dt)}aiClock+=dt;if(aiClock>2.0){aiClock=0;ai('enemy');ai('green')}const alive=[];for(const u of units){if(moveUnit(u,dt))arrive(u);else alive.push(u)}units=alive;checkWin();update();renderUnits()}requestAnimationFrame(frame)}function msg(s){toast.textContent=s;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1200)}
function reset(){running=true;paused=false;units=[];gesture=null;pan=null;selectedSource=null;autoPath=null;aiClock=0;view={x:0,y:0,w:2200,h:1320};applyView();overlay.style.display='none';document.querySelector('#pause').textContent='일시정지';resetData();renderBase();update();renderUnits();last=performance.now()}
svg.addEventListener('pointerdown',down);svg.addEventListener('pointermove',move);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',cancel);svg.addEventListener('wheel',e=>{e.preventDefault();const p=svgPoint(e);zoom(e.deltaY>0?1.15:.85,p.x,p.y)},{passive:false});document.querySelector('#zin').onclick=()=>zoom(.78);document.querySelector('#zout').onclick=()=>zoom(1.28);document.querySelector('#restart').onclick=reset;document.querySelector('#again').onclick=reset;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'계속':'일시정지';last=performance.now()};reset();requestAnimationFrame(frame)
})();</script></body></html>
