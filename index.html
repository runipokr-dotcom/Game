<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Territory Game Prototype v0.1</title>
<style>
  :root{
    --bg:#111318; --panel:#1a1e26; --text:#f3f5f7; --muted:#9aa4b2;
    --player:#4ea1ff; --enemy:#ff5d73; --neutral:#707a89; --line:#2a3140;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  #app{height:100%;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--panel);border-bottom:1px solid #272c36}
  header strong{font-size:16px}
  .sub{font-size:12px;color:var(--muted)}
  .btns{display:flex;gap:8px}
  button{border:0;border-radius:10px;padding:8px 11px;font-weight:700;background:#2a3140;color:#fff}
  button:active{transform:scale(.98)}
  #game{position:relative;flex:1;touch-action:none;background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,.03), transparent 22%),
      linear-gradient(#141820,#101218);}
  svg{width:100%;height:100%;display:block}
  .edge{stroke:var(--line);stroke-width:3;opacity:.85}
  .node circle{stroke:#fff;stroke-width:2;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
  .node text{fill:#fff;font-size:18px;font-weight:800;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
  .node.player circle{fill:var(--player)}
  .node.enemy circle{fill:var(--enemy)}
  .node.neutral circle{fill:var(--neutral)}
  .node.selected circle{stroke:#ffd65c;stroke-width:5}
  .unit{pointer-events:none}
  .unit circle{stroke:#fff;stroke-width:1.5}
  .unit text{fill:#fff;font-size:12px;font-weight:800;text-anchor:middle;dominant-baseline:middle}
  #toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(0,0,0,.72);padding:8px 12px;border-radius:999px;font-size:12px;color:#fff;opacity:0;transition:.2s}
  #toast.show{opacity:1}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(7,9,12,.72);backdrop-filter:blur(3px)}
  #card{width:min(88vw,360px);background:#1a1e26;border:1px solid #2b3340;border-radius:18px;padding:22px;text-align:center}
  #card h2{margin:0 0 8px}
  #card p{color:var(--muted)}
  #card button{width:100%;margin-top:10px;background:#3d86ff}
  footer{padding:7px 12px;background:var(--panel);border-top:1px solid #272c36;color:var(--muted);font-size:11px;text-align:center}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <strong>Territory Game <span class="sub">v0.1</span></strong>
      <div class="sub">내 거점 → 다른 거점 터치 = 병력 절반 출병</div>
    </div>
    <div class="btns">
      <button id="restart">재시작</button>
    </div>
  </header>

  <div id="game">
    <svg id="map" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="toast"></div>
    <div id="overlay">
      <div id="card">
        <h2 id="resultTitle">승리</h2>
        <p id="resultText"></p>
        <button id="again">한 판 더</button>
      </div>
    </div>
  </div>
  <footer>광고 없음 · 로그인 없음 · 저장 없음 · 한 파일 프로토타입</footer>
</div>

<script>
(() => {
  const svg = document.getElementById('map');
  const toast = document.getElementById('toast');
  const overlay = document.getElementById('overlay');
  const resultTitle = document.getElementById('resultTitle');
  const resultText = document.getElementById('resultText');

  const COLORS = { player:'#4ea1ff', enemy:'#ff5d73', neutral:'#707a89' };
  let nodes = [], edges = [], units = [], selected = null, running = true, lastT = performance.now();
  let aiTimer = 0, growthTimer = 0;

  function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

  function makeMap(){
    nodes = [
      {id:0,x:120,y:360,owner:'player',troops:28,rate:1.0},
      {id:1,x:300,y:170,owner:'neutral',troops:12,rate:.7},
      {id:2,x:300,y:540,owner:'neutral',troops:10,rate:.7},
      {id:3,x:500,y:350,owner:'neutral',troops:18,rate:.9},
      {id:4,x:690,y:160,owner:'neutral',troops:14,rate:.8},
      {id:5,x:700,y:540,owner:'neutral',troops:12,rate:.8},
      {id:6,x:880,y:350,owner:'enemy',troops:28,rate:1.0}
    ];
    edges = [[0,1],[0,2],[1,3],[2,3],[1,4],[2,5],[3,4],[3,5],[4,6],[5,6],[3,6]];
    units = []; selected = null; running = true; aiTimer=0; growthTimer=0; lastT=performance.now();
    overlay.style.display='none';
    renderStatic();
  }

  function renderStatic(){
    svg.innerHTML = '';
    edges.forEach(([a,b])=>{
      const A=nodes[a], B=nodes[b];
      const line=document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',A.x); line.setAttribute('y1',A.y);
      line.setAttribute('x2',B.x); line.setAttribute('y2',B.y);
      line.setAttribute('class','edge');
      svg.appendChild(line);
    });
    nodes.forEach(n=>{
      const g=document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('class',`node ${n.owner}`);
      g.dataset.id=n.id;
      const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx',n.x); c.setAttribute('cy',n.y); c.setAttribute('r',42);
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',n.x); t.setAttribute('y',n.y); t.textContent=Math.floor(n.troops);
      g.append(c,t); svg.appendChild(g);
      g.addEventListener('pointerdown',()=>tapNode(n.id));
    });
  }

  function updateNodeVisual(n){
    const g=svg.querySelector(`.node[data-id="${n.id}"]`);
    if(!g) return;
    g.setAttribute('class',`node ${n.owner}${selected===n.id?' selected':''}`);
    g.querySelector('text').textContent=Math.floor(n.troops);
  }

  function tapNode(id){
    if(!running) return;
    const n=nodes[id];
    if(selected===null){
      if(n.owner==='player'){
        selected=id; updateAllNodes();
      }else msg('파란색 내 거점을 먼저 선택');
      return;
    }
    if(id===selected){ selected=null; updateAllNodes(); return; }
    const from=nodes[selected];
    if(from.owner!=='player'){ selected=null; updateAllNodes(); return; }
    if(!connected(selected,id)){ msg('연결된 거점으로만 이동 가능'); return; }
    send(selected,id);
    selected=null; updateAllNodes();
  }

  function connected(a,b){
    return edges.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a));
  }

  function send(fromId,toId){
    const from=nodes[fromId], to=nodes[toId];
    const amount=Math.floor(from.troops/2);
    if(amount<1){ msg('병력이 부족함'); return; }
    from.troops-=amount;
    const d=dist(from,to);
    units.push({
      owner:from.owner, amount, x:from.x,y:from.y,
      from:fromId,to:toId, progress:0, speed:210/d
    });
    updateNodeVisual(from);
  }

  function arrive(u){
    const t=nodes[u.to];
    if(t.owner===u.owner){
      t.troops += u.amount;
    } else {
      if(u.amount>t.troops){
        t.owner=u.owner;
        t.troops=u.amount-t.troops;
      } else {
        t.troops-=u.amount;
      }
    }
    updateNodeVisual(t);
    checkEnd();
  }

  function aiAct(){
    const mine=nodes.filter(n=>n.owner==='enemy' && n.troops>=8);
    if(!mine.length) return;
    mine.sort((a,b)=>b.troops-a.troops);
    const from=mine[0];
    const neighbors=edges
      .filter(([a,b])=>a===from.id||b===from.id)
      .map(([a,b])=>nodes[a===from.id?b:a]);

    let targets=neighbors.filter(n=>n.owner!=='enemy');
    if(!targets.length) targets=neighbors;
    targets.sort((a,b)=>{
      const scoreA=(a.owner==='player'? -8:0)+a.troops;
      const scoreB=(b.owner==='player'? -8:0)+b.troops;
      return scoreA-scoreB;
    });
    if(targets[0]) sendAI(from.id,targets[0].id);
  }

  function sendAI(fromId,toId){
    const from=nodes[fromId];
    const amount=Math.floor(from.troops/2);
    if(amount<1) return;
    from.troops-=amount;
    const to=nodes[toId], d=dist(from,to);
    units.push({owner:'enemy',amount,x:from.x,y:from.y,from:fromId,to:toId,progress:0,speed:190/d});
    updateNodeVisual(from);
  }

  function drawUnits(){
    svg.querySelectorAll('.unit').forEach(e=>e.remove());
    units.forEach(u=>{
      const from=nodes[u.from], to=nodes[u.to];
      const x=from.x+(to.x-from.x)*u.progress, y=from.y+(to.y-from.y)*u.progress;
      const g=document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('class','unit');
      const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',16); c.setAttribute('fill',COLORS[u.owner]);
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',x); t.setAttribute('y',y); t.textContent=u.amount;
      g.append(c,t); svg.appendChild(g);
    });
  }

  function updateAllNodes(){ nodes.forEach(updateNodeVisual); }

  function checkEnd(){
    const p=nodes.some(n=>n.owner==='player') || units.some(u=>u.owner==='player');
    const e=nodes.some(n=>n.owner==='enemy') || units.some(u=>u.owner==='enemy');
    if(!e) end(true);
    else if(!p) end(false);
  }

  function end(win){
    running=false;
    resultTitle.textContent=win?'승리!':'패배';
    resultText.textContent=win?'빨간 거점을 전부 점령했다.':'내 거점을 전부 빼앗겼다.';
    overlay.style.display='flex';
  }

  function msg(s){
    toast.textContent=s; toast.classList.add('show');
    clearTimeout(msg.t); msg.t=setTimeout(()=>toast.classList.remove('show'),1200);
  }

  function tick(now){
    const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
    if(running){
      growthTimer+=dt; aiTimer+=dt;
      if(growthTimer>=1){
        growthTimer-=1;
        nodes.forEach(n=>{ if(n.owner!=='neutral') n.troops+=n.rate; });
        updateAllNodes();
      }
      if(aiTimer>=2.2){
        aiTimer=0; aiAct();
      }

      const arrived=[];
      units.forEach((u,i)=>{
        u.progress+=u.speed*dt;
        if(u.progress>=1) arrived.push(i);
      });
      for(let i=arrived.length-1;i>=0;i--){
        const idx=arrived[i], u=units[idx];
        units.splice(idx,1); arrive(u);
      }
      drawUnits();
    }
    requestAnimationFrame(tick);
  }

  document.getElementById('restart').onclick=makeMap;
  document.getElementById('again').onclick=makeMap;
  makeMap(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
