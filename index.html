<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Territory Game Prototype v0.2</title>
<style>
:root{--bg:#111318;--panel:#1a1e26;--text:#f3f5f7;--muted:#9aa4b2;--player:#4ea1ff;--enemy:#ff5d73;--neutral:#707a89;--line:#2a3140;--sel:#ffd65c}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--panel);border-bottom:1px solid #272c36;gap:10px}header strong{font-size:16px}.sub{font-size:12px;color:var(--muted)}.btns{display:flex;gap:8px}button{border:0;border-radius:10px;padding:8px 11px;font-weight:700;background:#2a3140;color:#fff}button:active{transform:scale(.98)}
#game{position:relative;flex:1;touch-action:none;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.03),transparent 22%),linear-gradient(#141820,#101218)}svg{width:100%;height:100%;display:block}.edge{stroke:var(--line);stroke-width:3;opacity:.85}.edge.hot{stroke:var(--sel);opacity:.95}.node circle{stroke:#fff;stroke-width:2;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}.node text{fill:#fff;font-size:18px;font-weight:800;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.node.player circle{fill:var(--player)}.node.enemy circle{fill:var(--enemy)}.node.neutral circle{fill:var(--neutral)}.node.selected circle{stroke:var(--sel);stroke-width:6}.node.drag-target circle{stroke:#fff3a6;stroke-width:6;stroke-dasharray:7 5}.unit{pointer-events:none}.unit circle{stroke:#fff;stroke-width:1.5}.unit text{fill:#fff;font-size:12px;font-weight:800;text-anchor:middle;dominant-baseline:middle}
#dragLine{display:none;stroke:var(--sel);stroke-width:5;stroke-linecap:round;opacity:.75;pointer-events:none}#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(0,0,0,.72);padding:8px 12px;border-radius:999px;font-size:12px;color:#fff;opacity:0;transition:.2s;white-space:nowrap}#toast.show{opacity:1}#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(7,9,12,.72);backdrop-filter:blur(3px)}#card{width:min(88vw,360px);background:#1a1e26;border:1px solid #2b3340;border-radius:18px;padding:22px;text-align:center}#card h2{margin:0 0 8px}#card p{color:var(--muted)}#card button{width:100%;margin-top:10px;background:#3d86ff}footer{padding:7px 12px;background:var(--panel);border-top:1px solid #272c36;color:var(--muted);font-size:11px;text-align:center}
</style>
</head>
<body>
<div id="app"><header><div><strong>Territory Game <span class="sub">v0.2</span></strong><div class="sub">드래그로 파란 거점 여러 개 훑기 → 목표 거점에서 손 떼기</div></div><div class="btns"><button id="restart">재시작</button></div></header><div id="game"><svg id="map" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"><line id="dragLine" x1="0" y1="0" x2="0" y2="0"></line></svg><div id="toast"></div><div id="overlay"><div id="card"><h2 id="resultTitle">승리</h2><p id="resultText"></p><button id="again">한 판 더</button></div></div></div><footer>탭 조작도 유지 · 드래그 다중 선택 지원 · 광고/로그인 없음</footer></div>
<script>
(()=>{
const svg=document.getElementById('map'),toast=document.getElementById('toast'),overlay=document.getElementById('overlay'),resultTitle=document.getElementById('resultTitle'),resultText=document.getElementById('resultText');
const COLORS={player:'#4ea1ff',enemy:'#ff5d73',neutral:'#707a89'};
let nodes=[],edges=[],units=[],selected=null,running=true,lastT=performance.now(),aiTimer=0,growthTimer=0;
let drag={active:false,pointerId:null,sources:new Set(),target:null,startNode:null,x:0,y:0,moved:false};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function makeMap(){nodes=[{id:0,x:120,y:360,owner:'player',troops:28,rate:1},{id:1,x:300,y:170,owner:'neutral',troops:12,rate:.7},{id:2,x:300,y:540,owner:'neutral',troops:10,rate:.7},{id:3,x:500,y:350,owner:'neutral',troops:18,rate:.9},{id:4,x:690,y:160,owner:'neutral',troops:14,rate:.8},{id:5,x:700,y:540,owner:'neutral',troops:12,rate:.8},{id:6,x:880,y:350,owner:'enemy',troops:28,rate:1}];edges=[[0,1],[0,2],[1,3],[2,3],[1,4],[2,5],[3,4],[3,5],[4,6],[5,6],[3,6]];units=[];selected=null;running=true;aiTimer=0;growthTimer=0;lastT=performance.now();resetDrag();overlay.style.display='none';renderStatic()}
function renderStatic(){svg.innerHTML='';edges.forEach(([a,b],i)=>{const A=nodes[a],B=nodes[b],line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',A.x);line.setAttribute('y1',A.y);line.setAttribute('x2',B.x);line.setAttribute('y2',B.y);line.setAttribute('class','edge');line.dataset.edge=i;svg.appendChild(line)});nodes.forEach(n=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class',`node ${n.owner}`);g.dataset.id=n.id;const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',n.x);c.setAttribute('cy',n.y);c.setAttribute('r',42);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',n.x);t.setAttribute('y',n.y);t.textContent=Math.floor(n.troops);g.append(c,t);svg.appendChild(g)});const dl=document.createElementNS('http://www.w3.org/2000/svg','line');dl.id='dragLine';svg.appendChild(dl);updateAllNodes()}
function updateNodeVisual(n){const g=svg.querySelector(`.node[data-id="${n.id}"]`);if(!g)return;const sel=selected===n.id||drag.sources.has(n.id),tar=drag.target===n.id;g.setAttribute('class',`node ${n.owner}${sel?' selected':''}${tar?' drag-target':''}`);g.querySelector('text').textContent=Math.floor(n.troops)}
const updateAllNodes=()=>nodes.forEach(updateNodeVisual);
function connected(a,b){return edges.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a))}
function send(fromId,toId){const from=nodes[fromId],to=nodes[toId],amount=Math.floor(from.troops/2);if(amount<1)return false;from.troops-=amount;units.push({owner:from.owner,amount,from:fromId,to:toId,progress:0,speed:210/dist(from,to)});updateNodeVisual(from);return true}
function sendMany(sourceIds,targetId){let sent=0;sourceIds.forEach(id=>{if(id!==targetId&&nodes[id].owner==='player'&&connected(id,targetId)&&send(id,targetId))sent++});if(!sent){msg('목표와 연결된 선택 거점이 없음');return false}msg(`${sent}개 거점에서 동시 출병`);return true}
function tapNode(id){if(!running)return;const n=nodes[id];if(selected===null){if(n.owner==='player'){selected=id;updateAllNodes()}else msg('파란색 내 거점을 먼저 선택');return}if(id===selected){selected=null;updateAllNodes();return}const from=nodes[selected];if(from.owner!=='player'){selected=null;updateAllNodes();return}if(!connected(selected,id)){msg('연결된 거점으로만 이동 가능');return}send(selected,id);selected=null;updateAllNodes()}
function svgPoint(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0}}
function nodeAt(x,y){let best=null,bestD=55;for(const n of nodes){const d=Math.hypot(n.x-x,n.y-y);if(d<bestD){best=n;bestD=d}}return best}
function beginDrag(e,n){if(!running||n.owner!=='player')return;drag.active=true;drag.pointerId=e.pointerId;drag.sources=new Set([n.id]);drag.target=null;drag.startNode=n.id;drag.x=n.x;drag.y=n.y;drag.moved=false;selected=null;svg.setPointerCapture?.(e.pointerId);updateDragVisual(n.x,n.y);updateAllNodes()}
function updateDrag(e){if(!drag.active||e.pointerId!==drag.pointerId)return;const p=svgPoint(e);if(Math.hypot(p.x-drag.x,p.y-drag.y)>12)drag.moved=true;drag.x=p.x;drag.y=p.y;const over=nodeAt(p.x,p.y);if(over&&over.owner==='player'){drag.sources.add(over.id);drag.target=null}else if(over){drag.target=over.id}else drag.target=null;updateDragVisual(p.x,p.y);updateAllNodes();highlightEdges()}
function endDrag(e){if(!drag.active||e.pointerId!==drag.pointerId)return;const p=svgPoint(e),over=nodeAt(p.x,p.y),wasMoved=drag.moved,start=drag.startNode,sources=[...drag.sources];svg.releasePointerCapture?.(e.pointerId);if(wasMoved&&over&&over.id!==start){if(over.owner==='player'&&drag.sources.has(over.id)){msg(`${drag.sources.size}개 거점 선택됨`)}else sendMany(sources,over.id)}else if(!wasMoved)tapNode(start);resetDrag();updateAllNodes();highlightEdges()}
function resetDrag(){drag={active:false,pointerId:null,sources:new Set(),target:null,startNode:null,x:0,y:0,moved:false};const line=document.getElementById('dragLine');if(line)line.style.display='none'}
function updateDragVisual(x,y){const line=document.getElementById('dragLine');if(!line||!drag.active)return;const src=nodes[drag.startNode];line.style.display='block';line.setAttribute('x1',src.x);line.setAttribute('y1',src.y);line.setAttribute('x2',x);line.setAttribute('y2',y)}
function highlightEdges(){svg.querySelectorAll('.edge').forEach(el=>el.setAttribute('class','edge'));if(!drag.active||drag.target===null)return;edges.forEach(([a,b],i)=>{const other=a===drag.target?b:b===drag.target?a:null;if(other!==null&&drag.sources.has(other)){const el=svg.querySelector(`.edge[data-edge="${i}"]`);if(el)el.setAttribute('class','edge hot')}})}
function arrive(u){const t=nodes[u.to];if(t.owner===u.owner)t.troops+=u.amount;else if(u.amount>t.troops){t.owner=u.owner;t.troops=u.amount-t.troops}else t.troops-=u.amount;updateNodeVisual(t);checkEnd()}
function aiAct(){const mine=nodes.filter(n=>n.owner==='enemy'&&n.troops>=8);if(!mine.length)return;mine.sort((a,b)=>b.troops-a.troops);const from=mine[0],neighbors=edges.filter(([a,b])=>a===from.id||b===from.id).map(([a,b])=>nodes[a===from.id?b:a]);let targets=neighbors.filter(n=>n.owner!=='enemy');if(!targets.length)targets=neighbors;targets.sort((a,b)=>((a.owner==='player'?-8:0)+a.troops)-((b.owner==='player'?-8:0)+b.troops));if(targets[0])sendAI(from.id,targets[0].id)}
function sendAI(fromId,toId){const from=nodes[fromId],amount=Math.floor(from.troops/2);if(amount<1)return;from.troops-=amount;const to=nodes[toId];units.push({owner:'enemy',amount,from:fromId,to:toId,progress:0,speed:190/dist(from,to)});updateNodeVisual(from)}
function drawUnits(){svg.querySelectorAll('.unit').forEach(e=>e.remove());units.forEach(u=>{const from=nodes[u.from],to=nodes[u.to],x=from.x+(to.x-from.x)*u.progress,y=from.y+(to.y-from.y)*u.progress,g=document.createElementNS('http://www.w3.org/2000/svg','g'),c=document.createElementNS('http://www.w3.org/2000/svg','circle'),t=document.createElementNS('http://www.w3.org/2000/svg','text');g.setAttribute('class','unit');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',16);c.setAttribute('fill',COLORS[u.owner]);t.setAttribute('x',x);t.setAttribute('y',y);t.textContent=u.amount;g.append(c,t);svg.appendChild(g)})}
function checkEnd(){const p=nodes.some(n=>n.owner==='player')||units.some(u=>u.owner==='player'),e=nodes.some(n=>n.owner==='enemy')||units.some(u=>u.owner==='enemy');if(!e)end(true);else if(!p)end(false)}
function end(win){running=false;resultTitle.textContent=win?'승리!':'패배';resultText.textContent=win?'빨간 거점을 전부 점령했다.':'내 거점을 전부 빼앗겼다.';overlay.style.display='flex'}
function msg(s){toast.textContent=s;toast.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>toast.classList.remove('show'),1200)}
function tick(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;if(running){growthTimer+=dt;aiTimer+=dt;if(growthTimer>=1){growthTimer-=1;nodes.forEach(n=>{if(n.owner!=='neutral')n.troops+=n.rate});updateAllNodes()}if(aiTimer>=2.2){aiTimer=0;aiAct()}const arrived=[];units.forEach((u,i)=>{u.progress+=u.speed*dt;if(u.progress>=1)arrived.push(i)});for(let i=arrived.length-1;i>=0;i--){const idx=arrived[i],u=units[idx];units.splice(idx,1);arrive(u)}drawUnits()}requestAnimationFrame(tick)}
svg.addEventListener('pointerdown',e=>{const p=svgPoint(e),n=nodeAt(p.x,p.y);if(n&&n.owner==='player'){e.preventDefault();beginDrag(e,n)}});svg.addEventListener('pointermove',e=>{if(drag.active){e.preventDefault();updateDrag(e)}});svg.addEventListener('pointerup',e=>{if(drag.active){e.preventDefault();endDrag(e)}});svg.addEventListener('pointercancel',()=>{resetDrag();updateAllNodes();highlightEdges()});
document.getElementById('restart').onclick=makeMap;document.getElementById('again').onclick=makeMap;makeMap();requestAnimationFrame(tick);
})();
</script>
</body>
</html>
