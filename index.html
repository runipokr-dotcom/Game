<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Territory Game v0.1.3</title>
<style>
:root{--bg:#0b1118;--panel:#151c25;--text:#f5f7fa;--muted:#9aa6b5;--blue:#4a9fff;--red:#ff6076;--green:#50d483;--neutral:#707b89;--line:#111821;--pick:#ffe68a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{height:100%;display:flex;flex-direction:column}header{height:50px;display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--panel);z-index:5}.title{font-weight:900;font-size:14px;white-space:nowrap}.ver{font-size:10px;color:var(--muted)}#hud{flex:1;text-align:center;font-size:11px;color:var(--muted)}button{border:0;border-radius:9px;padding:7px 9px;background:#2a3442;color:#fff;font-weight:800;font-size:11px}#game{position:relative;flex:1;min-height:0;touch-action:none;background:radial-gradient(circle at 50% 42%,#182536 0,#0b1118 72%)}svg{width:100%;height:100%;display:block;touch-action:none}.cell{stroke:none}.cell.neutral{fill:var(--neutral);opacity:.65}.cell.player{fill:var(--blue);opacity:.82}.cell.enemy{fill:var(--red);opacity:.82}.cell.green{fill:var(--green);opacity:.82}.border{stroke:var(--line);stroke-width:3.5;stroke-linecap:round;vector-effect:non-scaling-stroke}.selectedBorder{stroke:var(--pick);stroke-width:6;fill:none;vector-effect:non-scaling-stroke;pointer-events:none}.targetBorder{stroke:#fff;stroke-width:6;fill:none;vector-effect:non-scaling-stroke;pointer-events:none}.marker{pointer-events:none}.marker circle{stroke:#ffffffd8;stroke-width:2.2;vector-effect:non-scaling-stroke}.marker.player circle{fill:#2e83d8}.marker.enemy circle{fill:#d9475d}.marker.green circle{fill:#2aa667}.marker.neutral circle{fill:#59636f}.troops{fill:#fff;font-size:16px;font-weight:950;text-anchor:middle;dominant-baseline:middle}.rate{fill:#ffffffc9;font-size:8px;font-weight:800;text-anchor:middle}.unit{pointer-events:none}.unit circle{stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}.unit text{fill:#fff;font-size:10px;font-weight:900;text-anchor:middle;dominant-baseline:middle}.trace{fill:none;stroke:#fff2a1;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.9;vector-effect:non-scaling-stroke;pointer-events:none}#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 12px;border-radius:999px;font-size:11px;opacity:0;transition:opacity .15s;white-space:nowrap;pointer-events:none;z-index:5}#toast.show{opacity:1}#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#05080dcc;z-index:8}#card{background:#171e29;padding:24px;border-radius:18px;text-align:center;min-width:230px}footer{background:var(--panel);padding:5px;text-align:center;font-size:10px;color:var(--muted)}
</style>
</head>
<body><div id="app">
<header><div class="title">Territory Game <span class="ver">v0.1.3</span></div><div id="hud"></div><button id="pause">일시정지</button><button id="restart">새 게임</button></header>
<div id="game"><svg id="map" viewBox="0 0 1000 650" preserveAspectRatio="xMidYMid meet"></svg><div id="toast"></div><div id="overlay"><div id="card"><h2 id="resultTitle"></h2><p id="resultText"></p><button id="again">한 판 더</button></div></div></div>
<footer>숨은 타일 1개 = +0.1/초 · 아군 Territory에도 드롭해 병력 보충 가능</footer>
</div>
<script>
(()=>{
const NS='http://www.w3.org/2000/svg', svg=document.querySelector('#map'),hud=document.querySelector('#hud'),toast=document.querySelector('#toast'),overlay=document.querySelector('#overlay');
const COLS=20,ROWS=13,CW=50,CH=50,TEAM={player:'#4a9fff',enemy:'#ff6076',green:'#50d483',neutral:'#707b89'};
const seeds=[
 [2,2],[5,2],[8,2],[11,2],[14,2],[17,2],[18,4],
 [2,5],[5,5],[8,5],[11,5],[14,5],[17,6],[18,8],
 [2,10],[5,9],[8,9],[11,9],[14,9],[16,10],[18,10]
];
const weight=[.88,1.11,.95,1.13,.87,1.05,.96,1.12,.90,1.03,.94,1.15,.89,1.06,.93,1.10,.86,1.07,.98,1.12,.92];
let cells=[],territories=[],units=[],gesture=null,running=true,paused=false,last=performance.now(),aiClock=0,toastTimer=0,grid;
const key=(c,r)=>`${c},${r}`,D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function land(c,r){const x=(c-9.5)/9.5,y=(r-6)/5.65;const wob=.10*Math.sin(r*1.55)+.055*Math.cos(c*1.24);return x*x+y*y<1.03+wob&&!(c<2&&r<3)&&!(c>17&&r<2)&&!(c<1&&r>8)&&!(c>18&&r>9)}
function buildMap(){cells=[];territories=seeds.map((s,id)=>({id,owner:'neutral',troops:9+(id*7)%7,tileCount:0,rate:0,freeze:0,center:{x:0,y:0},cells:[]}));for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(land(c,r)){let best=0,score=1e9;for(let i=0;i<seeds.length;i++){const[sx,sy]=seeds[i],d=((c-sx)**2+(r-sy)**2)*weight[i];if(d<score){score=d;best=i}}const cell={c,r,tid:best,x:c*CW,y:r*CH};cells.push(cell);territories[best].cells.push(cell)}for(const t of territories){t.tileCount=t.cells.length;t.rate=t.tileCount*.1;let sx=0,sy=0;for(const q of t.cells){sx+=q.x+CW/2;sy+=q.y+CH/2}t.center={x:sx/t.cells.length,y:sy/t.cells.length}}setStart([14,7],'player');setStart([6,13],'enemy');setStart([3,4],'green')}
function setStart(ids,owner){ids.forEach((id,i)=>{territories[id].owner=owner;territories[id].troops=24-i*3;territories[id].freeze=0})}
function cellMap(){const m=new Map;for(const c of cells)m.set(key(c.c,c.r),c);return m}
function adjacent(a,b){for(const c of territories[a].cells)for(const[dc,dr]of[[1,0],[-1,0],[0,1],[0,-1]]){const n=grid.get(key(c.c+dc,c.r+dr));if(n&&n.tid===b)return true}return false}
function neighbors(id){const out=new Set;for(const c of territories[id].cells)for(const[dc,dr]of[[1,0],[-1,0],[0,1],[0,-1]]){const n=grid.get(key(c.c+dc,c.r+dr));if(n&&n.tid!==id)out.add(n.tid)}return[...out]}
function renderBase(){svg.innerHTML='';const fills=document.createElementNS(NS,'g');fills.id='fills';svg.append(fills);for(const c of cells){const r=document.createElementNS(NS,'rect');r.setAttribute('x',c.x-.25);r.setAttribute('y',c.y-.25);r.setAttribute('width',CW+.5);r.setAttribute('height',CH+.5);r.dataset.tid=c.tid;fills.append(r)}const borders=document.createElementNS(NS,'g');borders.id='borders';svg.append(borders);for(const c of cells)for(const[dc,dr,x1,y1,x2,y2]of[[0,-1,c.x,c.y,c.x+CW,c.y],[1,0,c.x+CW,c.y,c.x+CW,c.y+CH],[0,1,c.x,c.y+CH,c.x+CW,c.y+CH],[-1,0,c.x,c.y,c.x,c.y+CH]]){const n=grid.get(key(c.c+dc,c.r+dr));if(!n||n.tid!==c.tid){const l=document.createElementNS(NS,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('class','border');borders.append(l)}}const hi=document.createElementNS(NS,'g');hi.id='highlights';svg.append(hi);const tr=document.createElementNS(NS,'polyline');tr.id='trace';tr.setAttribute('class','trace');tr.style.display='none';svg.append(tr);const marks=document.createElementNS(NS,'g');marks.id='markers';svg.append(marks);for(const t of territories){const g=document.createElementNS(NS,'g');g.dataset.id=t.id;const c=document.createElementNS(NS,'circle'),tx=document.createElementNS(NS,'text'),rt=document.createElementNS(NS,'text');c.setAttribute('cx',t.center.x);c.setAttribute('cy',t.center.y);c.setAttribute('r',23);tx.setAttribute('x',t.center.x);tx.setAttribute('y',t.center.y-2);tx.setAttribute('class','troops');rt.setAttribute('x',t.center.x);rt.setAttribute('y',t.center.y+17);rt.setAttribute('class','rate');g.append(c,tx,rt);marks.append(g)}const ug=document.createElementNS(NS,'g');ug.id='units';svg.append(ug)}
function territoryOutline(id,cls){const g=document.querySelector('#highlights');for(const c of territories[id].cells)for(const[dc,dr,x1,y1,x2,y2]of[[0,-1,c.x,c.y,c.x+CW,c.y],[1,0,c.x+CW,c.y,c.x+CW,c.y+CH],[0,1,c.x,c.y+CH,c.x+CW,c.y+CH],[-1,0,c.x,c.y,c.x,c.y+CH]]){const n=grid.get(key(c.c+dc,c.r+dr));if(!n||n.tid!==id){const l=document.createElementNS(NS,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('class',cls);g.append(l)}}}
function update(){for(const el of svg.querySelectorAll('#fills rect')){const t=territories[+el.dataset.tid];el.setAttribute('class',`cell ${t.owner}`)}for(const t of territories){const g=svg.querySelector(`#markers [data-id="${t.id}"]`);if(g){g.setAttribute('class',`marker ${t.owner}`);g.querySelector('.troops').textContent=Math.floor(t.troops);g.querySelector('.rate').textContent=`+${t.rate.toFixed(1)}/s`}}const h=svg.querySelector('#highlights');h.innerHTML='';if(gesture){for(const id of gesture.path)territoryOutline(id,'selectedBorder');if(gesture.target!=null)territoryOutline(gesture.target,'targetBorder')}const counts={player:0,enemy:0,green:0};for(const t of territories)if(counts[t.owner]!=null)counts[t.owner]++;hud.textContent=`🔵${counts.player}  🔴${counts.enemy}  🟢${counts.green}`}
function svgPoint(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function at(p){const c=Math.floor(p.x/CW),r=Math.floor(p.y/CH),q=grid.get(key(c,r));return q?territories[q.tid]:null}
function pointerDown(e){if(!running||paused)return;const t=at(svgPoint(e));if(!t||t.owner!=='player')return;e.preventDefault();gesture={pid:e.pointerId,path:[t.id],target:null};svg.setPointerCapture?.(e.pointerId);showTrace(svgPoint(e));update()}
function pointerMove(e){if(!gesture||gesture.pid!==e.pointerId)return;e.preventDefault();const p=svgPoint(e),t=at(p);if(t){const last=gesture.path[gesture.path.length-1];if(t.owner==='player'){if(t.id!==last&&!gesture.path.includes(t.id)&&adjacent(last,t.id))gesture.path.push(t.id);gesture.target=null}else if(adjacent(last,t.id))gesture.target=t.id;else gesture.target=null}showTrace(p);update()}
function pointerUp(e){if(!gesture||gesture.pid!==e.pointerId)return;e.preventDefault();const g=gesture,t=at(svgPoint(e));gesture=null;svg.releasePointerCapture?.(e.pointerId);svg.querySelector('#trace').style.display='none';let target=null,sources=g.path.slice();if(t&&t.owner==='player'&&g.path.length>=2&&t.id===g.path[g.path.length-1]){target=t.id;sources=g.path.slice(0,-1)}else if(t&&t.owner!=='player'&&adjacent(g.path[g.path.length-1],t.id)){target=t.id}else if(g.target!=null){target=g.target}if(target==null||!sources.length){msg('목표 Territory에서 손을 떼세요');update();return}let sent=0;for(let i=0;i<sources.length;i++){const route=sources.slice(i);if(target===g.path[g.path.length-1]&&territories[target].owner==='player')route.push(target);else route.push(target);if(send(sources[i],target,'player',route))sent++}msg(territories[target].owner==='player'?`${sent}개 병력군 → 아군 보충`:`${sent}개 병력군 → 공격 출발`);update()}
function pointerCancel(){gesture=null;const tr=svg.querySelector('#trace');if(tr)tr.style.display='none';update()}
function showTrace(p){if(!gesture)return;const pts=gesture.path.map(id=>territories[id].center).concat([p]);const tr=svg.querySelector('#trace');tr.style.display='block';tr.setAttribute('points',pts.map(q=>`${q.x},${q.y}`).join(' '))}
function send(fromId,target,owner,route){const from=territories[fromId];let amount=Math.floor(from.troops*.5);amount=Math.min(amount,Math.max(0,Math.floor(from.troops)-1));if(amount<1)return false;from.troops-=amount;units.push({owner,amount,target,path:route,seg:0,prog:0,speed:165});return true}
function ai(owner){const mine=territories.filter(t=>t.owner===owner&&t.troops>=8);if(!mine.length)return;const opts=[];for(const s of mine)for(const n of neighbors(s.id)){const t=territories[n];if(t.owner!==owner)opts.push({s,t,score:t.troops-s.troops*.3+(t.owner==='neutral'?0:-2)})}if(!opts.length)return;opts.sort((a,b)=>a.score-b.score);const p=opts[Math.floor(Math.random()*Math.min(3,opts.length))];send(p.s.id,p.t.id,owner,[p.s.id,p.t.id])}
function moveUnit(u,dt){let rem=u.speed*dt;while(rem>0&&u.seg<u.path.length-1){const a=territories[u.path[u.seg]].center,b=territories[u.path[u.seg+1]].center,len=D(a,b),left=(1-u.prog)*len;if(rem<left){u.prog+=rem/len;rem=0}else{rem-=left;u.seg++;u.prog=0}}return u.seg>=u.path.length-1}
function pos(u){const a=territories[u.path[u.seg]].center,b=territories[u.path[Math.min(u.seg+1,u.path.length-1)]].center;return{x:a.x+(b.x-a.x)*u.prog,y:a.y+(b.y-a.y)*u.prog}}
function arrive(u){const t=territories[u.target];if(t.owner===u.owner){t.troops=Math.min(99,t.troops+u.amount);return}if(u.amount>t.troops){const left=u.amount-t.troops;t.owner=u.owner;t.troops=left;t.freeze=2.5}else if(u.amount<t.troops){t.troops-=u.amount}else{t.owner='neutral';t.troops=0;t.freeze=2.5}}
function renderUnits(){const g=svg.querySelector('#units');g.innerHTML='';for(const u of units){const p=pos(u),e=document.createElementNS(NS,'g'),c=document.createElementNS(NS,'circle'),tx=document.createElementNS(NS,'text');e.setAttribute('class','unit');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',14);c.setAttribute('fill',TEAM[u.owner]);tx.setAttribute('x',p.x);tx.setAttribute('y',p.y);tx.textContent=u.amount;e.append(c,tx);g.append(e)}}
function checkWin(){const pc=territories.filter(t=>t.owner==='player').length;if(pc>=13)return end('승리','21개 중 13개 Territory 확보');if(pc===0&&!units.some(u=>u.owner==='player'))return end('패배','파랑 Territory가 모두 사라졌습니다')}
function end(a,b){running=false;document.querySelector('#resultTitle').textContent=a;document.querySelector('#resultText').textContent=b;overlay.style.display='flex'}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(running&&!paused){for(const t of territories){if(t.freeze>0)t.freeze=Math.max(0,t.freeze-dt);else if(t.owner!=='neutral')t.troops=Math.min(99,t.troops+t.rate*dt)}aiClock+=dt;if(aiClock>2){aiClock=0;ai('enemy');ai('green')}const alive=[];for(const u of units){if(moveUnit(u,dt))arrive(u);else alive.push(u)}units=alive;checkWin();update();renderUnits()}requestAnimationFrame(frame)}
function msg(s){toast.textContent=s;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1100)}
function reset(){running=true;paused=false;units=[];gesture=null;aiClock=0;overlay.style.display='none';document.querySelector('#pause').textContent='일시정지';buildMap();grid=cellMap();renderBase();update();renderUnits();last=performance.now()}
svg.addEventListener('pointerdown',pointerDown);svg.addEventListener('pointermove',pointerMove);svg.addEventListener('pointerup',pointerUp);svg.addEventListener('pointercancel',pointerCancel);document.querySelector('#restart').onclick=reset;document.querySelector('#again').onclick=reset;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'계속':'일시정지';last=performance.now()};reset();requestAnimationFrame(frame);
})();
</script></body></html>
