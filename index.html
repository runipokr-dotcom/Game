<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Territory Game v0.1.5</title>
<style>
:root{--panel:#17313d;--text:#fff;--muted:#c9d8df;--blue:#2d8cff;--red:#ef4d4d;--green:#35b96b;--pick:#ffe676}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d171a;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{height:100%;display:flex;flex-direction:column}header{height:50px;display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--panel);z-index:5}.title{font-weight:900;font-size:14px;white-space:nowrap}.ver{font-size:10px;color:var(--muted)}#hud{flex:1;text-align:center;font-size:11px;color:var(--muted)}button{border:0;border-radius:9px;padding:7px 9px;background:#294957;color:#fff;font-weight:800;font-size:11px}#game{position:relative;flex:1;min-height:0;touch-action:none;background:linear-gradient(#87dc59,#6bc146)}svg{width:100%;height:100%;display:block;touch-action:none}.route{stroke:#fff;stroke-width:3;stroke-dasharray:7 7;opacity:.28;vector-effect:non-scaling-stroke}.route.auto{stroke:#ffe676;stroke-width:5;opacity:.95;stroke-dasharray:10 7}.zone{stroke:#ffffff55;stroke-width:2;vector-effect:non-scaling-stroke}.zone.player{fill:#4d9fff66}.zone.enemy{fill:#ff616166}.zone.green{fill:#51cf8366}.zone.neutral{fill:#d6d6d655}.towerBase{stroke:#24323a;stroke-width:4;vector-effect:non-scaling-stroke}.node.player .towerBase{fill:#2d8cff}.node.enemy .towerBase{fill:#ef4d4d}.node.green .towerBase{fill:#35b96b}.node.neutral .towerBase{fill:#b9b9b9}.towerTop{fill:#f5f6f7;stroke:#263640;stroke-width:3;vector-effect:non-scaling-stroke}.node.selected .towerBase{stroke:var(--pick);stroke-width:8}.node.target .towerBase{stroke:#fff;stroke-width:8}.troops{fill:#152028;font-size:18px;font-weight:950;text-anchor:middle}.rate{fill:#20343d;font-size:10px;font-weight:850;text-anchor:middle}.unit circle{stroke:#fff;stroke-width:2.5;vector-effect:non-scaling-stroke}.unit text{fill:#fff;font-size:10px;font-weight:900;text-anchor:middle;dominant-baseline:middle}.trace{fill:none;stroke:#ffe676;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.95;vector-effect:non-scaling-stroke;pointer-events:none}#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 12px;border-radius:999px;font-size:11px;opacity:0;transition:opacity .15s;white-space:nowrap;pointer-events:none;z-index:5}#toast.show{opacity:1}#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#071014cc;z-index:8}#card{background:#17313d;padding:24px;border-radius:18px;text-align:center;min-width:230px}footer{background:var(--panel);padding:5px;text-align:center;font-size:10px;color:var(--muted)}
</style>
</head>
<body><div id="app">
<header><div class="title">Territory Game <span class="ver">v0.1.5</span></div><div id="hud"></div><button id="pause">일시정지</button><button id="restart">새 게임</button></header>
<div id="game"><svg id="map" viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid meet"></svg><div id="toast"></div><div id="overlay"><div id="card"><h2 id="resultTitle"></h2><p id="resultText"></p><button id="again">한 판 더</button></div></div></div>
<footer>탭 2번 = 내 땅만 경유하는 최단거리 자동이동 · 드래그 = 수동 경로 지정</footer>
</div>
<script>
(()=>{
const NS='http://www.w3.org/2000/svg',svg=document.querySelector('#map'),hud=document.querySelector('#hud'),toast=document.querySelector('#toast'),overlay=document.querySelector('#overlay');
const TEAM={player:'#2d8cff',enemy:'#ef4d4d',green:'#35b96b',neutral:'#aaa'};
const P=[
[55,75],[280,65],[520,75],[760,65],[965,100],
[65,285],[300,255],[520,285],[755,255],[955,300],
[60,500],[295,470],[520,505],[755,475],[960,515],
[85,720],[330,705],[570,720],[805,710],[960,735],
[535,875]
];
const TILES=[8,11,9,14,10,12,7,13,9,11,10,15,8,12,9,13,10,14,8,11,16];
const EDGES=[[0,1],[0,5],[1,2],[1,6],[2,3],[2,6],[2,7],[3,4],[3,8],[4,9],[5,6],[5,10],[6,7],[6,10],[6,11],[7,8],[7,11],[7,12],[8,9],[8,12],[8,13],[9,14],[10,11],[10,15],[11,12],[11,15],[11,16],[12,13],[12,16],[12,17],[13,14],[13,17],[13,18],[14,19],[15,16],[16,17],[16,20],[17,18],[17,20],[18,19],[18,20]];
let territories=[],units=[],gesture=null,selectedSource=null,autoPath=null,running=true,paused=false,last=performance.now(),aiClock=0,toastTimer=0;
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function neighbors(id){const out=[];for(const[a,b]of EDGES){if(a===id)out.push(b);else if(b===id)out.push(a)}return out}
function adjacent(a,b){return EDGES.some(e=>(e[0]===a&&e[1]===b)||(e[1]===a&&e[0]===b))}
function shortestOwnedPath(start,target,owner='player'){
 const n=territories.length,dist=Array(n).fill(Infinity),prev=Array(n).fill(-1),used=Array(n).fill(false);dist[start]=0;
 for(let k=0;k<n;k++){
   let u=-1,best=Infinity;for(let i=0;i<n;i++)if(!used[i]&&dist[i]<best){best=dist[i];u=i}if(u<0)break;used[u]=true;if(u===target)break;
   for(const v of neighbors(u)){
     if(v!==target&&territories[v].owner!==owner)continue;
     if(u!==start&&u!==target&&territories[u].owner!==owner)continue;
     const nd=dist[u]+D(territories[u],territories[v]);if(nd<dist[v]){dist[v]=nd;prev[v]=u}
   }
 }
 if(!Number.isFinite(dist[target]))return null;const path=[];let cur=target;while(cur!==-1){path.push(cur);if(cur===start)break;cur=prev[cur]}if(path.at(-1)!==start)return null;return path.reverse()
}
function resetData(){territories=P.map((p,id)=>({id,x:p[0],y:p[1],owner:'neutral',troops:8+(id*5)%8,tileCount:TILES[id],rate:TILES[id]*.1,freeze:0,r:31+TILES[id]*1.75}));setStart([15,16],'player');setStart([3,4],'enemy');setStart([9,14],'green')}
function setStart(ids,owner){ids.forEach((id,i)=>{territories[id].owner=owner;territories[id].troops=25-i*3})}
function renderBase(){svg.innerHTML='';const bg=document.createElementNS(NS,'g');svg.append(bg);for(let i=0;i<22;i++){const c=document.createElementNS(NS,'circle');c.setAttribute('cx',40+(i*149)%930);c.setAttribute('cy',55+(i*227)%805);c.setAttribute('r',9+(i%4)*4);c.setAttribute('fill','#4ca63c22');bg.append(c)}const rg=document.createElementNS(NS,'g');rg.id='routes';svg.append(rg);for(const[a,b]of EDGES){const l=document.createElementNS(NS,'line');l.setAttribute('x1',territories[a].x);l.setAttribute('y1',territories[a].y);l.setAttribute('x2',territories[b].x);l.setAttribute('y2',territories[b].y);l.setAttribute('class','route');l.dataset.a=a;l.dataset.b=b;rg.append(l)}const zg=document.createElementNS(NS,'g');zg.id='zones';svg.append(zg);for(const t of territories){const z=document.createElementNS(NS,'circle');z.dataset.id=t.id;z.setAttribute('cx',t.x);z.setAttribute('cy',t.y);z.setAttribute('r',t.r);zg.append(z)}const tr=document.createElementNS(NS,'polyline');tr.id='trace';tr.setAttribute('class','trace');tr.style.display='none';svg.append(tr);const ng=document.createElementNS(NS,'g');ng.id='nodes';svg.append(ng);for(const t of territories){const g=document.createElementNS(NS,'g');g.dataset.id=t.id;const base=document.createElementNS(NS,'circle'),top=document.createElementNS(NS,'rect'),tx=document.createElementNS(NS,'text'),rt=document.createElementNS(NS,'text');base.setAttribute('cx',t.x);base.setAttribute('cy',t.y);base.setAttribute('r',25);base.setAttribute('class','towerBase');top.setAttribute('x',t.x-12);top.setAttribute('y',t.y-21);top.setAttribute('width',24);top.setAttribute('height',17);top.setAttribute('rx',5);top.setAttribute('class','towerTop');tx.setAttribute('x',t.x);tx.setAttribute('y',t.y+45);tx.setAttribute('class','troops');rt.setAttribute('x',t.x);rt.setAttribute('y',t.y+60);rt.setAttribute('class','rate');g.append(base,top,tx,rt);ng.append(g)}const ug=document.createElementNS(NS,'g');ug.id='units';svg.append(ug)}
function update(){for(const t of territories){const z=svg.querySelector(`#zones [data-id="${t.id}"]`);z.setAttribute('class',`zone ${t.owner}`);const g=svg.querySelector(`#nodes [data-id="${t.id}"]`);let cls=`node ${t.owner}`;if(gesture?.path.includes(t.id)||selectedSource===t.id)cls+=' selected';if(gesture?.target===t.id)cls+=' target';g.setAttribute('class',cls);g.querySelector('.troops').textContent=Math.floor(t.troops);g.querySelector('.rate').textContent=`+${t.rate.toFixed(1)}/s`}for(const l of svg.querySelectorAll('.route'))l.setAttribute('class','route');if(autoPath)for(let i=0;i<autoPath.length-1;i++){const a=autoPath[i],b=autoPath[i+1];for(const l of svg.querySelectorAll('.route')){const x=+l.dataset.a,y=+l.dataset.b;if((x===a&&y===b)||(x===b&&y===a))l.setAttribute('class','route auto')}}const counts={player:0,enemy:0,green:0};for(const t of territories)if(counts[t.owner]!=null)counts[t.owner]++;hud.textContent=`🔵${counts.player}  🔴${counts.enemy}  🟢${counts.green}`}
function svgPoint(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function at(p){let best=null,bd=1e9;for(const t of territories){const d=Math.hypot(p.x-t.x,p.y-t.y);if(d<t.r+16&&d<bd){best=t;bd=d}}return best}
function down(e){if(!running||paused)return;const t=at(svgPoint(e));if(!t)return;e.preventDefault();gesture={pid:e.pointerId,path:t.owner==='player'?[t.id]:[],target:null,start:t.id,moved:false,startX:e.clientX,startY:e.clientY};svg.setPointerCapture?.(e.pointerId);if(t.owner==='player')trace(svgPoint(e));update()}
function move(e){if(!gesture||gesture.pid!==e.pointerId)return;e.preventDefault();if(Math.hypot(e.clientX-gesture.startX,e.clientY-gesture.startY)>12)gesture.moved=true;if(!gesture.path.length)return;const p=svgPoint(e),t=at(p);if(t){const last=gesture.path.at(-1);if(t.owner==='player'){if(t.id!==last&&!gesture.path.includes(t.id)&&adjacent(last,t.id))gesture.path.push(t.id);gesture.target=null}else if(adjacent(last,t.id))gesture.target=t.id;else gesture.target=null}trace(p);update()}
function up(e){if(!gesture||gesture.pid!==e.pointerId)return;e.preventDefault();const g=gesture,t=at(svgPoint(e));gesture=null;svg.releasePointerCapture?.(e.pointerId);svg.querySelector('#trace').style.display='none';
 if(!g.moved){handleTap(t);update();return}
 if(!g.path.length){update();return}
 let target=null,sources=g.path.slice();if(t&&t.owner==='player'&&g.path.length>=2&&t.id===g.path.at(-1)){target=t.id;sources=g.path.slice(0,-1)}else if(t&&t.owner!=='player'&&adjacent(g.path.at(-1),t.id))target=t.id;else if(g.target!=null)target=g.target;if(target==null||!sources.length){msg('연결된 목표에 드롭');update();return}selectedSource=null;autoPath=null;let sent=0;for(let i=0;i<sources.length;i++){const route=sources.slice(i);if(route.at(-1)!==target)route.push(target);if(send(sources[i],target,'player',route))sent++}msg(`${sent}개 병력군 출발`);update()}
function handleTap(t){if(!t){selectedSource=null;autoPath=null;return}if(selectedSource==null){if(t.owner==='player'){selectedSource=t.id;autoPath=null;msg('목표를 탭하면 최단경로 자동 계산')}}else{if(t.id===selectedSource){selectedSource=null;autoPath=null;return}const path=shortestOwnedPath(selectedSource,t.id,'player');if(!path){msg('내 땅을 통한 경로 없음');return}autoPath=path.slice();const from=selectedSource;selectedSource=null;setTimeout(()=>{if(send(from,t.id,'player',path)){msg(`최단경로 ${path.length-1}구간 출발`)}autoPath=null;update()},180)}}
function cancel(){gesture=null;const t=svg.querySelector('#trace');if(t)t.style.display='none';update()}
function trace(p){if(!gesture?.path.length)return;const tr=svg.querySelector('#trace'),pts=gesture.path.map(id=>territories[id]).concat([p]);tr.style.display='block';tr.setAttribute('points',pts.map(q=>`${q.x},${q.y}`).join(' '))}
function send(fromId,target,owner,path){const from=territories[fromId];let amount=Math.floor(from.troops*.5);amount=Math.min(amount,Math.max(0,Math.floor(from.troops)-1));if(amount<1)return false;from.troops-=amount;units.push({owner,amount,target,path,seg:0,prog:0,speed:145});return true}
function ai(owner){const mine=territories.filter(t=>t.owner===owner&&t.troops>=9);if(!mine.length)return;const opts=[];for(const s of mine)for(const n of neighbors(s.id)){const t=territories[n];if(t.owner!==owner)opts.push({s,t,score:t.troops-s.troops*.25+(t.owner==='neutral'?0:-2)})}if(!opts.length)return;opts.sort((a,b)=>a.score-b.score);const p=opts[Math.floor(Math.random()*Math.min(3,opts.length))];send(p.s.id,p.t.id,owner,[p.s.id,p.t.id])}
function moveUnit(u,dt){let rem=u.speed*dt;while(rem>0&&u.seg<u.path.length-1){const a=territories[u.path[u.seg]],b=territories[u.path[u.seg+1]],len=D(a,b),left=(1-u.prog)*len;if(rem<left){u.prog+=rem/len;rem=0}else{rem-=left;u.seg++;u.prog=0}}return u.seg>=u.path.length-1}
function pos(u){const a=territories[u.path[u.seg]],b=territories[u.path[Math.min(u.seg+1,u.path.length-1)]];return{x:a.x+(b.x-a.x)*u.prog,y:a.y+(b.y-a.y)*u.prog}}
function arrive(u){const t=territories[u.target];if(t.owner===u.owner){t.troops=Math.min(99,t.troops+u.amount);return}if(u.amount>t.troops){t.owner=u.owner;t.troops=u.amount-t.troops;t.freeze=2.5}else if(u.amount<t.troops)t.troops-=u.amount;else{t.owner='neutral';t.troops=0;t.freeze=2.5}}
function renderUnits(){const g=svg.querySelector('#units');g.innerHTML='';for(const u of units){const p=pos(u),e=document.createElementNS(NS,'g'),c=document.createElementNS(NS,'circle'),tx=document.createElementNS(NS,'text');e.setAttribute('class','unit');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',16);c.setAttribute('fill',TEAM[u.owner]);tx.setAttribute('x',p.x);tx.setAttribute('y',p.y);tx.textContent=u.amount;e.append(c,tx);g.append(e)}}
function checkWin(){const pc=territories.filter(t=>t.owner==='player').length;if(pc>=13)return end('승리','21개 중 13개 거점 확보');if(pc===0&&!units.some(u=>u.owner==='player'))return end('패배','파랑 거점이 모두 사라졌습니다')}
function end(a,b){running=false;document.querySelector('#resultTitle').textContent=a;document.querySelector('#resultText').textContent=b;overlay.style.display='flex'}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(running&&!paused){for(const t of territories){if(t.freeze>0)t.freeze=Math.max(0,t.freeze-dt);else if(t.owner!=='neutral')t.troops=Math.min(99,t.troops+t.rate*dt)}aiClock+=dt;if(aiClock>2.1){aiClock=0;ai('enemy');ai('green')}const alive=[];for(const u of units){if(moveUnit(u,dt))arrive(u);else alive.push(u)}units=alive;checkWin();update();renderUnits()}requestAnimationFrame(frame)}
function msg(s){toast.textContent=s;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1100)}
function reset(){running=true;paused=false;units=[];gesture=null;selectedSource=null;autoPath=null;aiClock=0;overlay.style.display='none';document.querySelector('#pause').textContent='일시정지';resetData();renderBase();update();renderUnits();last=performance.now()}
svg.addEventListener('pointerdown',down);svg.addEventListener('pointermove',move);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',cancel);document.querySelector('#restart').onclick=reset;document.querySelector('#again').onclick=reset;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'계속':'일시정지';last=performance.now()};reset();requestAnimationFrame(frame)
})();
</script></body></html>
