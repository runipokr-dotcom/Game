<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Territory Game v0.2.3</title><style>:root{--bg:#111318;--panel:#1a1e26;--text:#f3f5f7;--muted:#9aa4b2;--player:#4ea1ff;--enemy:#ff5d73;--neutral:#707a89;--line:#2a3140;--sel:#ffd65c}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;overflow:hidden}#app{height:100%;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--panel)}.sub{font-size:12px;color:var(--muted)}button{border:0;border-radius:10px;padding:8px 11px;font-weight:700;background:#2a3140;color:#fff}#game{position:relative;flex:1;touch-action:none;background:#11151c}svg{width:100%;height:100%;display:block}.edge{stroke:var(--line);stroke-width:3}.edge.hot{stroke:var(--sel);stroke-width:5}.node .hit{fill:transparent}.node .core{stroke:#fff;stroke-width:2}.node.player .core{fill:var(--player)}.node.enemy .core{fill:var(--enemy)}.node.neutral .core{fill:var(--neutral)}.node.selected .core{stroke:var(--sel);stroke-width:7}.node.target .core{stroke:#fff3a6;stroke-width:7;stroke-dasharray:8 5}.node text{fill:#fff;font-size:18px;font-weight:800;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.unit{pointer-events:none}.unit circle{stroke:#fff}.unit text{fill:#fff;font-size:12px;font-weight:800;text-anchor:middle;dominant-baseline:middle}#dragLine{display:none;stroke:var(--sel);stroke-width:6;stroke-linecap:round;pointer-events:none}#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#000c;padding:8px 12px;border-radius:999px;font-size:12px;opacity:0;white-space:nowrap}#toast.show{opacity:1}#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#07090cbb}#card{background:var(--panel);padding:22px;border-radius:18px;text-align:center}footer{padding:7px;text-align:center;background:var(--panel);color:var(--muted);font-size:11px}</style></head><body><div id="app"><header><div><strong>Territory Game <span class="sub">v0.2.3</span></strong><div class="sub">탭=선택 · 드래그=출병 (완전 독립)</div></div><button id="restart">재시작</button></header><div id="game"><svg id="map" viewBox="0 0 1000 700"></svg><div id="toast"></div><div id="overlay"><div id="card"><h2 id="resultTitle"></h2><p id="resultText"></p><button id="again">한 판 더</button></div></div></div><footer>거점 주변 넓은 터치 판정 · 드래그는 선택 상태를 변경하지 않음</footer></div><script>(()=>{const svg=document.querySelector('#map'),toast=document.querySelector('#toast'),overlay=document.querySelector('#overlay');const C={player:'#4ea1ff',enemy:'#ff5d73'},HIT=82,THRESH=12;let nodes=[],edges=[],units=[],selected=new Set(),running=true,last=performance.now(),ai=0,grow=0;let gesture=null;const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function reset(){nodes=[{id:0,x:120,y:360,owner:'player',troops:28,rate:1},{id:1,x:300,y:170,owner:'neutral',troops:12,rate:.7},{id:2,x:300,y:540,owner:'neutral',troops:10,rate:.7},{id:3,x:500,y:350,owner:'neutral',troops:18,rate:.9},{id:4,x:690,y:160,owner:'neutral',troops:14,rate:.8},{id:5,x:700,y:540,owner:'neutral',troops:12,rate:.8},{id:6,x:880,y:350,owner:'enemy',troops:28,rate:1}];edges=[[0,1],[0,2],[1,3],[2,3],[1,4],[2,5],[3,4],[3,5],[4,6],[5,6],[3,6]];units=[];selected.clear();gesture=null;running=true;ai=grow=0;last=performance.now();overlay.style.display='none';render()}function render(){svg.innerHTML='';edges.forEach(([a,b],i)=>{let l=document.createElementNS('http://www.w3.org/2000/svg','line');Object.entries({x1:nodes[a].x,y1:nodes[a].y,x2:nodes[b].x,y2:nodes[b].y,class:'edge'}).forEach(([k,v])=>l.setAttribute(k,v));l.dataset.i=i;svg.append(l)});nodes.forEach(n=>{let g=document.createElementNS('http://www.w3.org/2000/svg','g');g.dataset.id=n.id;let h=document.createElementNS('http://www.w3.org/2000/svg','circle'),c=document.createElementNS('http://www.w3.org/2000/svg','circle'),t=document.createElementNS('http://www.w3.org/2000/svg','text');h.setAttribute('class','hit');h.setAttribute('cx',n.x);h.setAttribute('cy',n.y);h.setAttribute('r',HIT);c.setAttribute('class','core');c.setAttribute('cx',n.x);c.setAttribute('cy',n.y);c.setAttribute('r',42);t.setAttribute('x',n.x);t.setAttribute('y',n.y);g.append(h,c,t);svg.append(g)});let l=document.createElementNS('http://www.w3.org/2000/svg','line');l.id='dragLine';svg.append(l);updateNodes()}function updateNodes(){nodes.forEach(n=>{let g=svg.querySelector(`[data-id="${n.id}"]`);if(!g)return;let target=gesture&&gesture.moved&&gesture.target===n.id;g.setAttribute('class',`node ${n.owner}${selected.has(n.id)?' selected':''}${target?' target':''}`);g.querySelector('text').textContent=Math.floor(n.troops)})}function point(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}function at(p){let best=null,d=HIT;for(const n of nodes){let x=D(p,n);if(x<d){d=x;best=n}}return best}function connected(a,b){return edges.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a))}function send(a,b,owner='player'){let f=nodes[a],t=nodes[b],amount=Math.floor(f.troops/2);if(amount<1)return false;f.troops-=amount;units.push({owner,amount,from:a,to:b,p:0,speed:(owner==='player'?210:190)/D(f,t)});updateNodes();return true}function tap(n){if(n.owner!=='player'){msg('내 거점만 선택 가능');return}selected.has(n.id)?selected.delete(n.id):selected.add(n.id);msg(selected.size?`${selected.size}개 거점 선택`:'선택 해제');updateNodes()}function sources(start,target){if(selected.has(start)){let s=[...selected].filter(id=>nodes[id].owner==='player'&&connected(id,target));if(s.length)return s}return connected(start,target)?[start]:[]}function down(e){let n=at(point(e));if(!n||n.owner!=='player')return;e.preventDefault();gesture={id:e.pointerId,start:n.id,sx:e.clientX,sy:e.clientY,moved:false,target:null};svg.setPointerCapture?.(e.pointerId)}function move(e){if(!gesture||gesture.id!==e.pointerId)return;e.preventDefault();if(Math.hypot(e.clientX-gesture.sx,e.clientY-gesture.sy)>=THRESH)gesture.moved=true;if(!gesture.moved)return;let p=point(e),n=at(p);gesture.target=n&&n.id!==gesture.start?n.id:null;let l=document.querySelector('#dragLine'),s=nodes[gesture.start];l.style.display='block';l.setAttribute('x1',s.x);l.setAttribute('y1',s.y);l.setAttribute('x2',p.x);l.setAttribute('y2',p.y);updateNodes();hot()}function up(e){if(!gesture||gesture.id!==e.pointerId)return;e.preventDefault();let g=gesture,p=point(e),target=at(p);svg.releasePointerCapture?.(e.pointerId);document.querySelector('#dragLine').style.display='none';gesture=null;if(!g.moved){tap(nodes[g.start]);return}if(!target||target.id===g.start){updateNodes();hot();return msg('목표 거점 근처에서 손을 떼세요')}let src=sources(g.start,target.id),count=0;src.forEach(id=>{if(send(id,target.id))count++});msg(count?(count>1?`${count}개 거점 동시 출병`:'출병'):'연결된 이동 경로 없음');updateNodes();hot()}function hot(){svg.querySelectorAll('.edge').forEach(x=>x.setAttribute('class','edge'));if(!gesture||!gesture.target)return;sources(gesture.start,gesture.target).forEach(s=>edges.forEach(([a,b],i)=>{if((a===s&&b===gesture.target)||(b===s&&a===gesture.target))svg.querySelector(`[data-i="${i}"]`)?.setAttribute('class','edge hot')}))}function arrive(u){let t=nodes[u.to];if(t.owner===u.owner)t.troops+=u.amount;else if(u.amount>t.troops){t.owner=u.owner;t.troops=u.amount-t.troops}else t.troops-=u.amount;updateNodes();check()}function aiAct(){let m=nodes.filter(n=>n.owner==='enemy'&&n.troops>=8).sort((a,b)=>b.troops-a.troops)[0];if(!m)return;let ns=edges.filter(([a,b])=>a===m.id||b===m.id).map(([a,b])=>nodes[a===m.id?b:a]).sort((a,b)=>a.troops-b.troops);let t=ns.find(n=>n.owner!=='enemy')||ns[0];if(t)send(m.id,t.id,'enemy')}function drawUnits(){svg.querySelectorAll('.unit').forEach(x=>x.remove());units.forEach(u=>{let a=nodes[u.from],b=nodes[u.to],x=a.x+(b.x-a.x)*u.p,y=a.y+(b.y-a.y)*u.p,g=document.createElementNS('http://www.w3.org/2000/svg','g'),c=document.createElementNS('http://www.w3.org/2000/svg','circle'),t=document.createElementNS('http://www.w3.org/2000/svg','text');g.setAttribute('class','unit');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',16);c.setAttribute('fill',C[u.owner]);t.setAttribute('x',x);t.setAttribute('y',y);t.textContent=u.amount;g.append(c,t);svg.append(g)})}function check(){let p=nodes.some(n=>n.owner==='player')||units.some(u=>u.owner==='player'),e=nodes.some(n=>n.owner==='enemy')||units.some(u=>u.owner==='enemy');if(!p||!e){running=false;document.querySelector('#resultTitle').textContent=e?'패배':'승리!';document.querySelector('#resultText').textContent=e?'내 거점을 전부 빼앗겼다.':'빨간 거점을 전부 점령했다.';overlay.style.display='flex'}}function msg(s){toast.textContent=s;toast.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>toast.classList.remove('show'),1000)}function tick(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(running){grow+=dt;ai+=dt;if(grow>=1){grow-=1;nodes.forEach(n=>{if(n.owner!=='neutral')n.troops+=n.rate});updateNodes()}if(ai>=2.2){ai=0;aiAct()}let done=[];units.forEach((u,i)=>{u.p+=u.speed*dt;if(u.p>=1)done.push(i)});for(let i=done.length-1;i>=0;i--){let j=done[i],u=units[j];units.splice(j,1);arrive(u)}drawUnits()}requestAnimationFrame(tick)}svg.addEventListener('pointerdown',down);svg.addEventListener('pointermove',move);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',()=>{gesture=null;let l=document.querySelector('#dragLine');if(l)l.style.display='none';updateNodes();hot()});document.querySelector('#restart').onclick=reset;document.querySelector('#again').onclick=reset;reset();requestAnimationFrame(tick)})();</script></body></html>
