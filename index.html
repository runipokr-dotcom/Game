<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Territory Game v0.1.4</title>
<style>
:root{--bg:#79cf51;--panel:#17313d;--text:#fff;--muted:#c9d8df;--blue:#2d8cff;--red:#ef4d4d;--green:#35b96b;--neutral:#d7d7d7;--route:#ffffff99;--pick:#ffe676}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d171a;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{height:100%;display:flex;flex-direction:column}header{height:50px;display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--panel);z-index:5}.title{font-weight:900;font-size:14px;white-space:nowrap}.ver{font-size:10px;color:var(--muted)}#hud{flex:1;text-align:center;font-size:11px;color:var(--muted)}button{border:0;border-radius:9px;padding:7px 9px;background:#294957;color:#fff;font-weight:800;font-size:11px}#game{position:relative;flex:1;min-height:0;touch-action:none;background:linear-gradient(#87dc59,#6bc146)}svg{width:100%;height:100%;display:block;touch-action:none}.route{stroke:#fff;stroke-width:3;stroke-dasharray:7 7;opacity:.34;vector-effect:non-scaling-stroke}.zone{stroke:#ffffff55;stroke-width:2;vector-effect:non-scaling-stroke}.zone.player{fill:#4d9fff66}.zone.enemy{fill:#ff616166}.zone.green{fill:#51cf8366}.zone.neutral{fill:#d6d6d655}.node{cursor:pointer}.towerBase{stroke:#24323a;stroke-width:4;vector-effect:non-scaling-stroke}.node.player .towerBase{fill:#2d8cff}.node.enemy .towerBase{fill:#ef4d4d}.node.green .towerBase{fill:#35b96b}.node.neutral .towerBase{fill:#b9b9b9}.towerTop{fill:#f5f6f7;stroke:#263640;stroke-width:3;vector-effect:non-scaling-stroke}.node.selected .towerBase{stroke:var(--pick);stroke-width:8}.node.target .towerBase{stroke:#fff;stroke-width:8}.troops{fill:#152028;font-size:18px;font-weight:950;text-anchor:middle}.rate{fill:#20343d;font-size:10px;font-weight:850;text-anchor:middle}.unit circle{stroke:#fff;stroke-width:2.5;vector-effect:non-scaling-stroke}.unit text{fill:#fff;font-size:10px;font-weight:900;text-anchor:middle;dominant-baseline:middle}.trace{fill:none;stroke:#ffe676;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.95;vector-effect:non-scaling-stroke;pointer-events:none}#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 12px;border-radius:999px;font-size:11px;opacity:0;transition:opacity .15s;white-space:nowrap;pointer-events:none;z-index:5}#toast.show{opacity:1}#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#071014cc;z-index:8}#card{background:#17313d;padding:24px;border-radius:18px;text-align:center;min-width:230px}footer{background:var(--panel);padding:5px;text-align:center;font-size:10px;color:var(--muted)}
</style>
</head>
<body><div id="app">
<header><div class="title">Territory Game <span class="ver">v0.1.4</span></div><div id="hud"></div><button id="pause">일시정지</button><button id="restart">새 게임</button></header>
<div id="game"><svg id="map" viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid meet"></svg><div id="toast"></div><div id="overlay"><div id="card"><h2 id="resultTitle"></h2><p id="resultText"></p><button id="again">한 판 더</button></div></div></div>
<footer>마지막 참고 이미지형 전장 · 숨은 타일 1개 = +0.1/초 · 거리별 실제 이동</footer>
</div>
<script>
(()=>{
const NS='http://www.w3.org/2000/svg',svg=document.querySelector('#map'),hud=document.querySelector('#hud'),toast=document.querySelector('#toast'),overlay=document.querySelector('#overlay');
const TEAM={player:'#2d8cff',enemy:'#ef4d4d',green:'#35b96b',neutral:'#aaa'};
const P=[
[95,120],[285,105],[500,120],[720,110],[900,145],
[110,290],[310,270],[500,295],[690,270],[890,315],
[105,470],[300,455],[500,470],[700,460],[900,500],
[145,650],[350,650],[560,650],[760,660],[900,690],
[510,825]
];
const TILES=[8,11,9,14,10,12,7,13,9,11,10,15,8,12,9,13,10,14,8,11,16];
const EDGES=[[0,1],[0,5],[1,2],[1,6],[2,3],[2,6],[2,7],[3,4],[3,8],[4,9],[5,6],[5,10],[6,7],[6,10],[6,11],[7,8],[7,11],[7,12],[8,9],[8,12],[8,13],[9,14],[10,11],[10,15],[11,12],[11,15],[11,16],[12,13],[12,16],[12,17],[13,14],[13,17],[13,18],[14,19],[15,16],[16,17],[16,20],[17,18],[17,20],[18,19],[18,20]];
let territories=[],units=[],gesture=null,running=true,paused=false,last=performance.now(),aiClock=0,toastTimer=0;
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function neighbors(id){const out=[];for(const[e1,e2]of EDGES){if(e1===id)out.push(e2);else if(e2===id)out.push(e1)}return out}
function adjacent(a,b){return EDGES.some(e=>(e[0]===a&&e[1]===b)||(e[1]===a&&e[0]===b))}
function resetData(){territories=P.map((p,id)=>({id,x:p[0],y:p[1],owner:'neutral',troops:8+(id*5)%8,tileCount:TILES[id],rate:TILES[id]*.1,freeze:0,r:34+TILES[id]*2.0}));setStart([15,16],'player');setStart([3,4],'enemy');setStart([9,14],'green')}
function setStart(ids,owner){ids.forEach((id,i)=>{territories[id].owner=owner;territories[id].troops=25-i*3})}
function renderBase(){svg.innerHTML='';const bg=document.createElementNS(NS,'g');svg.append(bg);for(let i=0;i<22;i++){const c=document.createElementNS(NS,'circle');c.setAttribute('cx',60+(i*137)%920);c.setAttribute('cy',70+(i*211)%790);c.setAttribute('r',10+(i%4)*5);c.setAttribute('fill','#4ca63c22');bg.append(c)}const rg=document.createElementNS(NS,'g');rg.id='routes';svg.append(rg);for(const[a,b]of EDGES){const l=document.createElementNS(NS,'line');l.setAttribute('x1',territories[a].x);l.setAttribute('y1',territories[a].y);l.setAttribute('x2',territories[b].x);l.setAttribute('y2',territories[b].y);l.setAttribute('class','route');l.dataset.a=a;l.dataset.b=b;rg.append(l)}const zg=document.createElementNS(NS,'g');zg.id='zones';svg.append(zg);for(const t of territories){const z=document.createElementNS(NS,'circle');z.dataset.id=t.id;z.setAttribute('cx',t.x);z.setAttribute('cy',t.y);z.setAttribute('r',t.r);zg.append(z)}const tr=document.createElementNS(NS,'polyline');tr.id='trace';tr.setAttribute('class','trace');tr.style.display='none';svg.append(tr);const ng=document.createElementNS(NS,'g');ng.id='nodes';svg.append(ng);for(const t of territories){const g=document.createElementNS(NS,'g');g.dataset.id=t.id;const base=document.createElementNS(NS,'circle'),top=document.createElementNS(NS,'rect'),tx=document.createElementNS(NS,'text'),rt=document.createElementNS(NS,'text');base.setAttribute('cx',t.x);base.setAttribute('cy',t.y);base.setAttribute('r',27);base.setAttribute('class','towerBase');top.setAttribute('x',t.x-13);top.setAttribute('y',t.y-23);top.setAttribute('width',26);top.setAttribute('height',18);top.setAttribute('rx',5);top.setAttribute('class','towerTop');tx.setAttribute('x',t.x);tx.setAttribute('y',t.y+48);tx.setAttribute('class','troops');rt.setAttribute('x',t.x);rt.setAttribute('y',t.y+63);rt.setAttribute('class','rate');g.append(base,top,tx,rt);ng.append(g)}const ug=document.createElementNS(NS,'g');ug.id='units';svg.append(ug)}
function update(){for(const t of territories){const z=svg.querySelector(`#zones [data-id="${t.id}"]`);z.setAttribute('class',`zone ${t.owner}`);const g=svg.querySelector(`#nodes [data-id="${t.id}"]`);let cls=`node ${t.owner}`;if(gesture?.path.includes(t.id))cls+=' selected';if(gesture?.target===t.id)cls+=' target';g.setAttribute('class',cls);g.querySelector('.troops').textContent=Math.floor(t.troops);g.querySelector('.rate').textContent=`+${t.rate.toFixed(1)}/s`}const counts={player:0,enemy:0,green:0};for(const t of territories)if(counts[t.owner]!=null)counts[t.owner]++;hud.textContent=`🔵${counts.player}  🔴${counts.enemy}  🟢${counts.green}`}
function svgPoint(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function at(p){let best=null,bd=1e9;for(const t of territories){const d=Math.hypot(p.x-t.x,p.y-t.y);if(d<t.r+18&&d<bd){best=t;bd=d}}return best}
function down(e){if(!running||paused)return;const t=at(svgPoint(e));if(!t||t.owner!=='player')return;e.preventDefault();gesture={pid:e.pointerId,path:[t.id],target:null};svg.setPointerCapture?.(e.pointerId);trace(svgPoint(e));update()}
function move(e){if(!gesture||gesture.pid!==e.pointerId)return;e.preventDefault();const p=svgPoint(e),t=at(p);if(t){const last=gesture.path.at(-1);if(t.owner==='player'){if(t.id!==last&&!gesture.path.includes(t.id)&&adjacent(last,t.id))gesture.path.push(t.id);gesture.target=null}else if(adjacent(last,t.id))gesture.target=t.id;else gesture.target=null}trace(p);update()}
function up(e){if(!gesture||gesture.pid!==e.pointerId)return;e.preventDefault();const g=gesture,t=at(svgPoint(e));gesture=null;svg.releasePointerCapture?.(e.pointerId);svg.querySelector('#trace').style.display='none';let target=null,sources=g.path.slice();if(t&&t.owner==='player'&&g.path.length>=2&&t.id===g.path.at(-1)){target=t.id;sources=g.path.slice(0,-1)}else if(t&&t.owner!=='player'&&adjacent(g.path.at(-1),t.id))target=t.id;else if(g.target!=null)target=g.target;if(target==null||!sources.length){msg('연결된 목표에 드롭');update();return}let sent=0;for(let i=0;i<sources.length;i++){const route=sources.slice(i);if(route.at(-1)!==target)route.push(target);if(send(sources[i],target,'player',route))sent++}msg(territories[target].owner==='player'?`${sent}개 병력군 보충 출발`:`${sent}개 병력군 공격 출발`);update()}
function cancel(){gesture=null;const t=svg.querySelector('#trace');if(t)t.style.display='none';update()}
function trace(p){const tr=svg.querySelector('#trace'),pts=gesture.path.map(id=>territories[id]).concat([p]);tr.style.display='block';tr.setAttribute('points',pts.map(q=>`${q.x},${q.y}`).join(' '))}
function send(fromId,target,owner,path){const from=territories[fromId];let amount=Math.floor(from.troops*.5);amount=Math.min(amount,Math.max(0,Math.floor(from.troops)-1));if(amount<1)return false;from.troops-=amount;units.push({owner,amount,target,path,seg:0,prog:0,speed:150});return true}
function ai(owner){const mine=territories.filter(t=>t.owner===owner&&t.troops>=9);if(!mine.length)return;const opts=[];for(const s of mine)for(const n of neighbors(s.id)){const t=territories[n];if(t.owner!==owner)opts.push({s,t,score:t.troops-s.troops*.25+(t.owner==='neutral'?0:-2)})}if(!opts.length)return;opts.sort((a,b)=>a.score-b.score);const p=opts[Math.floor(Math.random()*Math.min(3,opts.length))];send(p.s.id,p.t.id,owner,[p.s.id,p.t.id])}
function moveUnit(u,dt){let rem=u.speed*dt;while(rem>0&&u.seg<u.path.length-1){const a=territories[u.path[u.seg]],b=territories[u.path[u.seg+1]],len=D(a,b),left=(1-u.prog)*len;if(rem<left){u.prog+=rem/len;rem=0}else{rem-=left;u.seg++;u.prog=0}}return u.seg>=u.path.length-1}
function pos(u){const a=territories[u.path[u.seg]],b=territories[u.path[Math.min(u.seg+1,u.path.length-1)]];return{x:a.x+(b.x-a.x)*u.prog,y:a.y+(b.y-a.y)*u.prog}}
function arrive(u){const t=territories[u.target];if(t.owner===u.owner){t.troops=Math.min(99,t.troops+u.amount);return}if(u.amount>t.troops){t.owner=u.owner;t.troops=u.amount-t.troops;t.freeze=2.5}else if(u.amount<t.troops)t.troops-=u.amount;else{t.owner='neutral';t.troops=0;t.freeze=2.5}}
function renderUnits(){const g=svg.querySelector('#units');g.innerHTML='';for(const u of units){const p=pos(u),e=document.createElementNS(NS,'g'),c=document.createElementNS(NS,'circle'),tx=document.createElementNS(NS,'text');e.setAttribute('class','unit');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',16);c.setAttribute('fill',TEAM[u.owner]);tx.setAttribute('x',p.x);tx.setAttribute('y',p.y);tx.textContent=u.amount;e.append(c,tx);g.append(e)}}
function checkWin(){const pc=territories.filter(t=>t.owner==='player').length;if(pc>=13)return end('승리','21개 중 13개 거점 확보');if(pc===0&&!units.some(u=>u.owner==='player'))return end('패배','파랑 거점이 모두 사라졌습니다')}
function end(a,b){running=false;document.querySelector('#resultTitle').textContent=a;document.querySelector('#resultText').textContent=b;overlay.style.display='flex'}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(running&&!paused){for(const t of territories){if(t.freeze>0)t.freeze=Math.max(0,t.freeze-dt);else if(t.owner!=='neutral')t.troops=Math.min(99,t.troops+t.rate*dt)}aiClock+=dt;if(aiClock>2.1){aiClock=0;ai('enemy');ai('green')}const alive=[];for(const u of units){if(moveUnit(u,dt))arrive(u);else alive.push(u)}units=alive;checkWin();update();renderUnits()}requestAnimationFrame(frame)}
function msg(s){toast.textContent=s;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1000)}
function reset(){running=true;paused=false;units=[];gesture=null;aiClock=0;overlay.style.display='none';document.querySelector('#pause').textContent='일시정지';resetData();renderBase();update();renderUnits();last=performance.now()}
svg.addEventListener('pointerdown',down);svg.addEventListener('pointermove',move);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',cancel);document.querySelector('#restart').onclick=reset;document.querySelector('#again').onclick=reset;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'계속':'일시정지';last=performance.now()};reset();requestAnimationFrame(frame)
})();
</script></body></html>
